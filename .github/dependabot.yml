# Dependabot configured as closely to renovate.json as the format allows.
#
# This file is deliberately maximal. Every lane in renovate.json that CAN be
# expressed here IS expressed here, so the remaining difference is a capability
# gap rather than a configuration gap. See ENTERPRISE.md section 7 for what is
# still missing and why.
#
# Note the shape of the cost: renovate.json expresses all of this for every
# ecosystem at once via matchers and templates. Here each ecosystem repeats the
# same policy by hand, and every new dependency family means editing patterns.
version: 2

updates:
  # ---------------------------------------------------------------- npm ----
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 15
    labels: [dependencies, dependabot]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope

    # Equivalent of Renovate's minimumReleaseAge, and genuinely comparable:
    # Dependabot's per-semver-level granularity is good. The difference is that
    # Renovate sets this per packageRule, this is per ecosystem.
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 7

    # Renovate suppresses this with one rule: allowedVersions "<6.1.0".
    # @typescript-eslint/parser 8.x declares peer typescript ">=4.8.4 <6.1.0",
    # so typescript 7 can never resolve.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

    groups:
      # Peer-coupled family. Renovate expresses this as one matchPackageNames
      # rule that applies to every update type automatically; here the patterns
      # are hand-maintained and must be repeated in the security group below.
      eslint-typescript-toolchain:
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
          - "typescript"

      npm-development-non-major:
        dependency-type: development
        update-types: [minor, patch]

      npm-production-non-major:
        dependency-type: production
        update-types: [minor, patch]

      # Security updates are NOT grouped by the rules above unless applies-to
      # says so. Split major from non-major so a breaking security fix cannot
      # block the safe ones.
      npm-security-non-major:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

      npm-security-major:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [major]

  # ---------------------------------------------------------------- go ----
  - package-ecosystem: gomod
    directory: "/services/go-api"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 10
    labels: [dependencies, dependabot, go]
    cooldown:
      default-days: 7
      semver-major-days: 21
    groups:
      go-non-major:
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  # ------------------------------------------------------------- python ----
  # requirements.txt pins exact versions and has no lockfile, so a partial bump
  # leaves it unresolvable. Everything moves as one group, majors included -
  # the equivalent of Renovate's separateMajorMinor:false on the pip rule.
  - package-ecosystem: pip
    directory: "/services/py-worker"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    labels: [dependencies, dependabot, python]
    cooldown:
      default-days: 7
      semver-major-days: 21
    groups:
      python-all:
        patterns: ["*"]
      python-security-all:
        applies-to: security-updates
        patterns: ["*"]

  # ------------------------------------------------------------- docker ----
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Kyiv
    labels: [dependencies, dependabot, docker]
    cooldown:
      default-days: 7
      semver-major-days: 21
    groups:
      docker-all:
        patterns: ["*"]

  # ------------------------------------------------------ github-actions ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Kyiv
    labels: [dependencies, dependabot, github-actions]
    cooldown:
      default-days: 7
      semver-major-days: 21
    groups:
      actions-all:
        patterns: ["*"]

# Touched to force a fresh Dependabot version-update check.
# Re-touched after closing the npm PRs, to force a fresh version-update check.
